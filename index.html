<!DOCTYPE html>
<html>
<head>
<title>Asynchronous Error Handling Adventure</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<style>
body{
    background-image: url(https://thumbs.dreamstime.com/b/incredibly-beautiful-sunset-sun-lake-sunrise-landscape-panorama-nature-sky-amazing-colorful-clouds-fantasy-design-115177001.jpg);
    background-repeat: no-repeat;
    background-size: cover;
}
</style>
</head>
<body class="bg-light">
<div class="mt-5 container">
<div class="card p-4 shadow mx-auto" style="max-width:700px;">
<h1 class="text-center mb-4">Async/Await Error Handling</h1>
<button class="btn btn-primary" onclick="errorHandling()">Fetch Data</button>
<div id="result" class="my-3"></div>
</div>
</div>

<script>
function fetchData(){
    return new Promise((resolve, reject)=>{
        setTimeout(()=>{
        let randomNum = Math.random();
    if(randomNum < 0.5){

        resolve("Data Fetched Successfully");
    }
    else{
        reject("Failed to fetch data");
    }
        }, 1000) 
    })

}
<!-- async/await function -->

async function errorHandling(){

try{
let data = await fetchData();
 document.getElementById("result").innerHTML = `
<div class="alert alert-success">${data}</div>
    `;

}
catch(error){
    document.getElementById("result").innerHTML = `
<div class="alert alert-danger">${error}</div>
    `;
}

}

</script>
</body>
</html>
